name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Contract + server tests (Hardhat EDR, solc 0.8.37)
        run: npm test
      - name: Type check + production build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Slither static analysis (fails on High findings; triage in docs/SECURITY.md)
        run: |
          pip install --quiet slither-analyzer==0.11.6 solc-select
          solc-select install 0.8.37 && solc-select use 0.8.37
          for c in EcoLoopPickup EcoLoopTeleporterBridge EcoLoopRewards EcoLoopForwarder EcoLoopCertificate; do
            echo "::group::Slither $c"
            slither contracts/$c.sol \
              --solc-remaps "@openzeppelin=node_modules/@openzeppelin" \
              --solc-args "--optimize --optimize-runs 200 --evm-version cancun" \
              --filter-paths node_modules --exclude-optimization --exclude-informational --fail-high
            echo "::endgroup::"
          done
